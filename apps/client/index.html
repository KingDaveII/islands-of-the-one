<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islands of the One</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1628;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
      }
      .overlay-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 380px;
        max-height: calc(100% - 16px);
        overflow: auto;
        background: rgba(20, 17, 31, 0.94);
        color: #e8e2d6;
        font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
        border: 1px solid #3a3354;
        padding: 8px;
        z-index: 10;
      }
      .overlay-panel header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .overlay-panel header span {
        color: #8f87a8;
      }
      .overlay-panel .status {
        width: 100%;
        color: #ffe7a3;
      }
      .overlay-panel button {
        background: #7d5236;
        color: #fff;
        border: 1px solid #ead9b6;
        font: inherit;
        cursor: pointer;
      }
      .overlay-panel textarea {
        width: 100%;
        height: 120px;
        background: #0f0d18;
        color: #ffe7a3;
        font: 11px ui-monospace, monospace;
      }
      .overlay-panel summary {
        cursor: pointer;
        color: #f2b65a;
        margin-top: 4px;
      }
      .overlay-panel .row {
        display: grid;
        grid-template-columns: 1fr 110px 56px;
        gap: 6px;
        align-items: center;
      }
      .overlay-panel .row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .overlay-panel output {
        text-align: right;
      }
      .overlay-panel output.changed {
        color: #ffe7a3;
      }
      #debug-overlay {
        position: fixed;
        bottom: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        background: rgba(20, 17, 31, 0.85);
        color: #fff4c7;
        font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
        border: 1px solid #3a3354;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
