<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale: iOS zooms the page into a focused input under 16 px; the game sizes itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Islands of the One</title>
    <link rel="icon" href="data:," />
    <!-- "Add to Home Screen" opens the game full screen in landscape (iOS has no full-screen API for pages;
         M2 Task 10). The home-screen icons join the manifest when ART delivers them. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Islands of the One" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#2a2540" />
    <link
      rel="preload"
      href="/fonts/Silkscreen-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Tiny5-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Self-hosted pixel faces (SIL OFL 1.1, licenses in public/fonts). */
      @font-face {
        font-family: 'Silkscreen';
        src: url('/fonts/Silkscreen-Regular.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Tiny5';
        src: url('/fonts/Tiny5-Regular.woff2') format('woff2');
        font-display: block;
      }
      /* Design-system tokens (see apps/client/src/palette.ts). */
      :root {
        --hollow-light: #f4efe6;
        --hollow-dusk: #a99fc4;
        --hollow-below: #5b5478;
        --hollow-deep: #2a2540;
        --spark-amber: #f2b65a;
        --dream-night: #1c2147;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--hollow-deep);
        overflow: hidden;
        /* No browser gestures over the game (M2 Task 10): no pan, pinch or double-tap zoom, no pull to
           refresh, no long-press callout or text selection, no tap flash. The form inputs opt back in. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The canvas is the window's size (render/cameras.ts) and sits at the top left, so a page box taller than the
         window (a phone's browser bars) leaves its spare room below, never above the game. */
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      #game canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
      /* Held upright on a phone the game waits under the portrait line (ui/portrait.ts): its inputs too. */
      .turn-sideways .game-input {
        visibility: hidden;
      }
      /* Typed text: real inputs in a real form over the canvas (src/ui/formFields.ts places
         them in page coordinates, sizes the face to 8 game px and sets the colours from palette.ts).
         Absolute, not fixed: a phone keyboard scrolls the page, and the inputs scroll with the canvas. */
      .game-form {
        margin: 0;
      }
      .game-input {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-family: 'Tiny5', monospace;
        -webkit-font-smoothing: none;
        z-index: 5;
        /* Typing, selecting and pasting work in the inputs, and a tap focuses them. */
        touch-action: manipulation;
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      .game-form-submit {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      /* Dev panels use the Panel look: dark fired clay, a raised bevel, a thin glowing rim. */
      .overlay-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 380px;
        max-height: calc(100% - 16px);
        overflow: auto;
        background: var(--hollow-deep);
        color: var(--hollow-light);
        font:
          12px/1.35 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        border: 1px solid var(--spark-amber);
        outline: 2px solid var(--dream-night);
        box-shadow: inset 2px 2px 0 var(--hollow-below);
        padding: 8px;
        z-index: 10;
      }
      .overlay-panel header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
        font-family: 'Silkscreen', monospace;
        font-size: 16px;
      }
      .overlay-panel header span {
        color: var(--hollow-dusk);
        font:
          12px ui-monospace,
          monospace;
      }
      .overlay-panel .status {
        width: 100%;
        color: var(--spark-amber);
      }
      .overlay-panel button {
        background: var(--hollow-below);
        color: var(--hollow-light);
        border: 1px solid var(--dream-night);
        font:
          12px ui-monospace,
          monospace;
        cursor: pointer;
      }
      .overlay-panel textarea {
        width: 100%;
        height: 120px;
        background: var(--dream-night);
        color: var(--spark-amber);
        font:
          11px ui-monospace,
          monospace;
      }
      .overlay-panel summary {
        cursor: pointer;
        color: var(--spark-amber);
        margin-top: 4px;
      }
      .overlay-panel .row {
        display: grid;
        grid-template-columns: 1fr 110px 56px;
        gap: 6px;
        align-items: center;
      }
      .overlay-panel .row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .overlay-panel .row select {
        background: var(--hollow-below);
        color: var(--hollow-light);
        border: 1px solid var(--dream-night);
        font: inherit;
      }
      .overlay-panel .row.readonly output {
        color: var(--hollow-dusk);
      }
      .overlay-panel output {
        text-align: right;
      }
      .overlay-panel output.changed {
        color: var(--spark-amber);
      }
      #debug-overlay {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 6px 8px;
        background: var(--hollow-deep);
        color: var(--hollow-light);
        font:
          12px/1.3 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        border: 1px solid var(--hollow-below);
        outline: 1px solid var(--dream-night);
        z-index: 10;
        pointer-events: none;
      }
      #debug-overlay pre {
        margin: 0;
        font: inherit;
      }
      /* The Writ letters demo: one row per letter state. */
      #debug-overlay .writ {
        display: grid;
        grid-template-columns: max-content auto;
        gap: 6px 10px;
        align-items: center;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--hollow-below);
        color: var(--hollow-dusk);
      }
      #debug-overlay canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
