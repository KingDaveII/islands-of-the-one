name: Deploy staging

on:
  # After CI succeeds on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual (re)deploy. Leave `sha` empty to build and deploy the selected ref;
  # set it to a previously built commit SHA to roll back without rebuilding.
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of already-pushed images to deploy (rollback). Empty = build the selected ref.
        required: false
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/islands

jobs:
  build:
    name: build + push images
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        name: Image name and tag
        env:
          APP: ${{ matrix.app }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${APP}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # The client's label shows both (docs/DEPLOY.md); the server image ignores BUILD_TIME.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy to staging
    needs: build
    # Runs after a successful build, or on its own for a rollback dispatch.
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.sha != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No environment url: it would print the staging domain on every run page,
    # and run logs are public once the repo is.
    environment:
      name: staging
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ inputs.sha || needs.build.outputs.sha }}
      # A secret, so GitHub masks the domain wherever it shows up in a log.
      STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy config always comes from the workflow's own ref (main), so a
          # rollback swaps images without reverting compose/Caddy changes.
          sparse-checkout: docker

      - name: Resolve image names
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-char commit SHA, got '$SHA'"; exit 1; }
          [[ -n "$STAGING_DOMAIN" ]] || { echo "::error::secret STAGING_DOMAIN is not set on the staging environment"; exit 1; }
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "SERVER_IMAGE=${prefix}-server"
            echo "CLIENT_IMAGE=${prefix}-client"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point "staging" tag at the deployed SHA (rollback only)
        if: inputs.sha != ''
        run: |
          for image in "$SERVER_IMAGE" "$CLIENT_IMAGE"; do
            docker buildx imagetools inspect "$image:$SHA" >/dev/null \
              || { echo "::error::$image:$SHA not found in ghcr.io"; exit 1; }
            docker buildx imagetools create --tag "$image:staging" "$image:$SHA"
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # The SSH host is a secret like the domain (it is the domain, or an
          # address). DEPLOY_USER is a variable: it isn't secret, and as a secret
          # GitHub masks every "deploy" in the logs.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          [[ -n "$DEPLOY_HOST" ]] || { echo "::error::secret DEPLOY_HOST is not set on the staging environment"; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "::error::set the variable DEPLOY_USER on the staging environment"; exit 1; }
          # Whether the SSH host is the staging domain, without printing either.
          if [[ "$DEPLOY_HOST" == "$STAGING_DOMAIN" ]]; then same=yes; else same=no; fi
          echo "SSH host is the staging domain: ${same}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host staging
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          CFG
          chmod 600 ~/.ssh/config
          # retry CMD...: run CMD, and run it again when ssh/scp reports a
          # connection failure (exit 255), up to 3 retries 5, 10 and 20 s apart.
          # Any other exit code (a remote command failing) is returned at once.
          cat > "$RUNNER_TEMP/ssh-retry.sh" <<'SH'
          retry() {
            local attempt=1 rc
            while true; do
              rc=0
              "$@" || rc=$?
              if [ "$rc" -ne 255 ] || [ "$attempt" -gt 3 ]; then
                return "$rc"
              fi
              local delay=$((5 * 2 ** (attempt - 1)))
              echo "::warning::'$1' lost the SSH connection (exit 255); retry ${attempt} of 3 in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }
          SH

      - name: Upload compose file, Caddyfile and deploy script
        run: |
          {
            echo "SERVER_IMAGE=${SERVER_IMAGE}"
            echo "CLIENT_IMAGE=${CLIENT_IMAGE}"
            echo "IMAGE_TAG=${SHA}"
            echo "STAGING_DOMAIN=${STAGING_DOMAIN}"
          } > deploy.env
          # deploy.env goes only to the VPS (Caddy needs STAGING_DOMAIN); it is
          # never printed to the log.
          # Never uploads .env: POSTGRES_PASSWORD stays host-managed.
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/ssh-retry.sh"
          retry scp docker/compose.staging.yml docker/Caddyfile docker/deploy.sh deploy.env "staging:${DEPLOY_DIR}/"

      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # One SSH session per attempt: deploy.sh takes its lock, logs in with
          # the token from stdin (never on a command line), pulls, logs out and
          # starts. A retry after a dropped connection waits for the lock.
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/ssh-retry.sh"
          deploy() {
            # shellcheck disable=SC2029 # expanding on the runner is intended
            printf '%s' "$GHCR_TOKEN" | ssh staging "bash '${DEPLOY_DIR}/deploy.sh' --login '${GHCR_USER}'"
          }
          retry deploy

      - name: Wait for /health on staging
        run: |
          url="https://${STAGING_DOMAIN}/health"
          # First deploy also waits for Caddy to obtain a certificate.
          for attempt in $(seq 1 60); do
            body=$(curl -fsS --max-time 5 "$url" 2>/dev/null || true)
            if [ -n "$body" ] && jq -e --arg sha "$SHA" '.status == "ok" and .version == $sha' >/dev/null <<<"$body"; then
              echo "healthy after ${attempt} attempt(s): $body"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-no response}"
            sleep 5
          done
          echo "::error::/health on staging did not report status ok for $SHA within 5 minutes"
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          # Service status only. Server and Caddy logs carry visitors' IP
          # addresses and the domain, and run logs are public: read them on the
          # VPS with deploy.sh --logs.
          # shellcheck disable=SC2029
          ssh staging "bash '${DEPLOY_DIR}/deploy.sh' --status" || true
