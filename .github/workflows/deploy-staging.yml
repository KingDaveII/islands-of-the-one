name: Deploy staging

on:
  # After CI succeeds on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual (re)deploy. Leave `sha` empty to build and deploy the selected ref;
  # set it to a previously built commit SHA to roll back without rebuilding.
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of already-pushed images to deploy (rollback). Empty = build the selected ref.
        required: false
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/islands

jobs:
  build:
    name: build + push images
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        name: Image name and tag
        env:
          APP: ${{ matrix.app }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${APP}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:staging
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy to staging
    needs: build
    # Runs after a successful build, or on its own for a rollback dispatch.
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.sha != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ inputs.sha || needs.build.outputs.sha }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy config always comes from the workflow's own ref (main), so a
          # rollback swaps images without reverting compose/Caddy changes.
          sparse-checkout: docker

      - name: Resolve image names
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-char commit SHA, got '$SHA'"; exit 1; }
          [[ -n "$STAGING_DOMAIN" ]] || { echo "::error::variable STAGING_DOMAIN is not set on the staging environment"; exit 1; }
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "SERVER_IMAGE=${prefix}-server"
            echo "CLIENT_IMAGE=${prefix}-client"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point "staging" tag at the deployed SHA (rollback only)
        if: inputs.sha != ''
        run: |
          for image in "$SERVER_IMAGE" "$CLIENT_IMAGE"; do
            docker buildx imagetools inspect "$image:$SHA" >/dev/null \
              || { echo "::error::$image:$SHA not found in ghcr.io"; exit 1; }
            docker buildx imagetools create --tag "$image:staging" "$image:$SHA"
          done

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host staging
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          CFG
          chmod 600 ~/.ssh/config

      - name: Upload compose file, Caddyfile and deploy script
        run: |
          {
            echo "SERVER_IMAGE=${SERVER_IMAGE}"
            echo "CLIENT_IMAGE=${CLIENT_IMAGE}"
            echo "IMAGE_TAG=${SHA}"
            echo "STAGING_DOMAIN=${STAGING_DOMAIN}"
          } > deploy.env
          # Never uploads .env: POSTGRES_PASSWORD stays host-managed.
          scp docker/compose.staging.yml docker/Caddyfile docker/deploy.sh deploy.env "staging:${DEPLOY_DIR}/"

      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Token goes over stdin, never on a command line; deploy.sh logs out
          # again after pulling.
          # shellcheck disable=SC2029 # expanding on the runner is intended
          printf '%s' "$GHCR_TOKEN" | ssh staging "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          # shellcheck disable=SC2029
          ssh staging "bash '${DEPLOY_DIR}/deploy.sh'"

      - name: Wait for https://${{ vars.STAGING_DOMAIN }}/health
        run: |
          url="https://${STAGING_DOMAIN}/health"
          # First deploy also waits for Caddy to obtain a certificate.
          for attempt in $(seq 1 60); do
            body=$(curl -fsS --max-time 5 "$url" 2>/dev/null || true)
            if [ -n "$body" ] && jq -e --arg sha "$SHA" '.status == "ok" and .version == $sha' >/dev/null <<<"$body"; then
              echo "healthy after ${attempt} attempt(s): $body"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-no response}"
            sleep 5
          done
          echo "::error::$url did not report status ok for $SHA within 5 minutes"
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          # shellcheck disable=SC2029
          ssh staging "bash '${DEPLOY_DIR}/deploy.sh' --status; bash '${DEPLOY_DIR}/deploy.sh' --logs 100" || true
