name: Release

# Retag the images built for the release commit with the release version and
# "latest". Nothing is rebuilt and nothing is deployed.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] \
            || { echo "::error::release tag '$VERSION' is not a v* semver tag"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag images
        run: |
          # For release events GITHUB_SHA is the commit the tag points at.
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for app in server client; do
            image="${prefix}-${app}"
            if ! docker buildx imagetools inspect "${image}:${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "::error::${image}:${GITHUB_SHA} does not exist. Releases must point at a commit on main that was built by 'Deploy staging'."
              exit 1
            fi
            docker buildx imagetools create \
              --tag "${image}:${VERSION}" \
              --tag "${image}:latest" \
              "${image}:${GITHUB_SHA}"
            echo "${image}:${GITHUB_SHA} -> ${VERSION}, latest"
          done
